name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build Workspace
        run: pnpm build

      - name: Run Test Suite
        run: pnpm test
        env:
          NODE_ENV: test
          DELIVERY_ENCRYPTION_KEY: "test-encryption-key-32bytes-ci-mock!!"
          ADMIN_SESSION_SECRET: "test-admin-session-secret-32bytes-ci!!"
